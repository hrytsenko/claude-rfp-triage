name: Audit skills

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit-skills:
    name: Audit skills
    uses: cisco-ai-defense/skill-scanner/.github/workflows/scan-skills.yml@f7824651ffeb9b89f7682ddd97d6fba8fe9c10b1 # 2.3.2
    permissions:
      contents: read
      actions: read
      security-events: write
    with:
      scanner_version: "2.3.2"
      skill_path: skills
      policy: low-noise
      fail_on_severity: high
      use_llm: true
      llm_provider: openai
      llm_model: openai/gpt-6.1-terra
    secrets:
      llm_api_key: ${{ secrets.SKILL_SCANNER_OPENAI_KEY }}
